name: Deploy to Lighthouse

# 官网实际由腾讯云 Lighthouse 服务器承载（134.175.187.12，Nginx + /var/www/heheppf）
# 推送 main 后通过 rsync over SSH 发布，并用线上首页做一次健康检查。
# 注意：CloudBase 已于 2026-09-01 弃用（其要求的 CNAME 无法在当前 DNS 服务商配置），
#      原 "Deploy to CloudBase" 工作流已移除，否则会出现「部署成功但线上不更新」。

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只跑一个部署，避免并发 rsync 互相干扰
concurrency:
  group: deploy-lighthouse
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 配置 SSH 部署密钥
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.LH_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.LH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH 配置完成"

      - name: 同步站点文件到服务器
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=15" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='cloudfunctions/' \
            --exclude='cloudbaserc.json' \
            --exclude='README.md' \
            --exclude='COLLABORATING.md' \
            --exclude='*_to_*.txt' \
            --exclude='pages/' \
            ./ "${{ secrets.LH_USER }}@${{ secrets.LH_HOST }}:/var/www/heheppf/"

      - name: 线上健康检查
        run: |
          sleep 3
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://www.heheppf.com/ || echo "000")
          echo "首页 HTTP 状态: $code"
          if [ "$code" != "200" ]; then
            echo "::error::部署后首页返回 $code，请检查服务器"
            exit 1
          fi
          echo "部署验证通过 ✅"
